name: Atualizar lives

on:
  schedule:
    - cron: "*/15 * * * *"   # a cada 15 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
    inputs:
      busca_completa:
        description: "Busca reforçada em todos os canais (gasta ~1.800 unidades de cota)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar os dados
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          FORCE_DEEP_ALL: ${{ inputs.busca_completa }}
        run: node scripts/update.mjs

      - name: Baixar escudos para o site
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund sharp
          node scripts/baixar-escudos.mjs

      - name: Guardar escudos novos no repositório
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/escudos
          git diff --cached --quiet || (git commit -m "Escudos novos" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
